<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烧烤摊抽奖 — 二维码</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a00;
      font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      color: #fff;
    }

    .card {
      background: linear-gradient(160deg, #2d1200, #1a0800);
      border: 2px solid rgba(255,140,0,0.5);
      border-radius: 24px;
      padding: 32px 28px 24px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 0 60px rgba(255,106,0,0.3);
    }

    .flame { font-size: 48px; margin-bottom: 8px; animation: fp 1.5s ease-in-out infinite; }
    @keyframes fp { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

    h1 { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 16px #ff6a00; margin-bottom: 4px; letter-spacing: 2px; }
    .sub { font-size: 13px; color: #ffb347; margin-bottom: 20px; }

    #qr-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .url-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,140,0,0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #ffb347;
      word-break: break-all;
      margin-bottom: 16px;
    }

    .prizes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .p-item {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
    }
    .p-item .lv { font-weight: 700; margin-bottom: 2px; }
    .p-item .nm { color: #ffcc88; }
    .p1 .lv { color: #ffd700; }
    .p2 .lv { color: #c0c0c0; }
    .p3 .lv { color: #cd7f32; }
    .p4 .lv { color: #66cc66; }

    .rule { font-size: 11px; color: #888; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
    .rule span { color: #ff8c00; }

    .print-btn {
      margin-top: 24px;
      padding: 10px 28px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    @media print {
      body { background: #fff; }
      .print-btn { display: none; }
      .card { border-color: #ccc; box-shadow: none; background: #fff; color: #000; }
      h1 { color: #000; text-shadow: none; }
      .sub { color: #555; }
      .url-box { color: #333; border-color: #ccc; }
      .p-item { background: #f5f5f5; }
      .rule { color: #444; }
      .p1 .lv,.p2 .lv,.p3 .lv,.p4 .lv { color: #333; }
      .nm { color: #555 !important; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="flame">🔥</div>
  <h1>烧烤摊幸运抽奖</h1>
  <div class="sub">扫码参与 · 免费抽好礼</div>

  <div id="qr-wrap"></div>

  <div class="url-box" id="urlBox">加载中...</div>

  <div class="prizes">
    <div class="p-item p1"><div class="lv">🥇 一等奖</div><div class="nm">玉米 10 串 × 1份</div></div>
    <div class="p-item p2"><div class="lv">🥈 二等奖</div><div class="nm">玉米 5 串 × 5份</div></div>
    <div class="p-item p3"><div class="lv">🥉 三等奖</div><div class="nm">小肉串 2 串 × 2份</div></div>
    <div class="p-item p4"><div class="lv">🎖️ 四等奖</div><div class="nm">韭菜/土豆 2串×2份</div></div>
  </div>

  <div class="rule">
    每周中奖上限 <span>10 人</span> &nbsp;|&nbsp; 奖品每周 <span>自动重置</span>
  </div>
</div>

<button class="print-btn" onclick="window.print()">🖨️ 打印二维码</button>

<script>
  // 自动读取当前页面同目录的 index.html 地址
  const base = location.href.replace(/qrcode\.html.*$/, 'index.html');
  document.getElementById('urlBox').textContent = base;

  new QRCode(document.getElementById('qr-wrap'), {
    text: base,
    width: 220,
    height: 220,
    colorDark: '#1a0800',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
